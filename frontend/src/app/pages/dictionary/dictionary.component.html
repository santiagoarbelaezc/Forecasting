<!-- ============================================================
     DICTIONARY PAGE — minimalist
     ============================================================ -->
<div class="min-h-screen bg-white pt-24 pb-20">

  <!-- Header -->
  <header class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-14 pb-10">
    <p class="reveal text-crimson-accent text-sm font-semibold uppercase tracking-[0.2em] mb-4">{{ dictionaryData.length }} términos</p>
    <h1 class="reveal text-5xl sm:text-6xl font-extrabold text-obsidian-950 font-headline tracking-tight" style="animation-delay:.08s">Diccionario</h1>
    <p class="reveal text-gray-500 text-lg mt-4 max-w-2xl" style="animation-delay:.16s">
      Conceptos clave, variables meteorológicas y fundamentos matemáticos del estudio.
    </p>
  </header>

  <!-- Search + filters -->
  <div class="sticky top-[88px] z-30 bg-white/90 backdrop-blur border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 space-y-3">
      <div class="relative max-w-2xl">
        <svg class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input [(ngModel)]="search" type="text" placeholder="Buscar término…"
          class="w-full pl-12 pr-10 py-3.5 rounded-2xl bg-gray-50 border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-crimson-accent focus:bg-white text-base transition-all">
        <button *ngIf="search" (click)="search=''" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700">✕</button>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button *ngFor="let cat of categories"
          (click)="selectedCategory = cat"
          [ngClass]="selectedCategory === cat ? 'bg-obsidian-950 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
          class="px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 hover:-translate-y-0.5">
          {{ cat }}
        </button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

    <div *ngIf="filtered.length === 0" class="py-24 text-center text-gray-400 reveal">
      <p class="text-lg">Sin resultados para esta búsqueda.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <article *ngFor="let item of filtered; let i = index"
           (mousemove)="onMove($event)"
           class="mcard reveal"
           [style.animation-delay]="(Math.min(i, 12) * 40) + 'ms'">
        <div class="relative">
          <div class="flex items-start justify-between gap-3 mb-3">
            <h3 class="mcard-title text-xl font-bold text-obsidian-950 font-headline tracking-tight">{{ item.term }}</h3>
            <span class="text-xs font-medium text-gray-400 whitespace-nowrap pt-1.5">{{ item.category }}</span>
          </div>
          <p class="text-gray-600 text-base leading-relaxed line-clamp-3">{{ item.shortDesc }}</p>
          <div *ngIf="item.unitOrFormula" class="mt-4 px-3 py-2 rounded-xl bg-gray-50 text-sm font-mono text-gray-800 overflow-x-auto">
            {{ item.unitOrFormula }}
          </div>
          <button *ngIf="item.relatedSectionId"
            (click)="ui.jumpToSection(item.relatedSectionId)"
            class="mcard-more mt-5 text-sm font-semibold text-crimson-accent flex items-center gap-1.5">
            Ir al artículo <span class="mcard-arrow">→</span>
          </button>
        </div>
        <span class="mcard-line"></span>
      </article>
    </div>
  </div>
</div>
