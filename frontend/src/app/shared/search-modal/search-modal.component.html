<!-- ============================================================
     MODAL 1: SEARCH MODAL (Ctrl+K)
     ============================================================ -->
<div *ngIf="ui.isSearchOpen" (click)="ui.closeSearch()" class="modal-backdrop">
  <div (click)="$event.stopPropagation()" class="subtle-card w-full max-w-xl p-4 sm:p-6 bg-white border border-gray-200 shadow-2xl relative">
    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
      <div class="flex items-center gap-2 text-obsidian-950">
        <svg class="w-5 h-5 text-crimson-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span class="font-headline font-bold text-sm uppercase tracking-wider">Buscar en el Artículo</span>
      </div>
      <button (click)="ui.closeSearch()" class="p-1 rounded-lg hover:bg-gray-100 text-gray-500 hover:text-gray-900">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="mt-4">
      <input id="search-modal-input" 
        [ngModel]="ui.searchQuery" 
        (ngModelChange)="ui.onSearchInput($event)"
        type="text" 
        placeholder="Escribe un concepto (ej. VAR, LSTM, TSMixer, Taylor, nRMSE, CRISP-DM)..." 
        class="w-full px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl bg-gray-50 border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-crimson-accent text-sm">
    </div>

    <div class="mt-4 max-h-80 overflow-y-auto pr-1">
      <div *ngIf="!ui.searchQuery || ui.searchQuery.length < 2" class="py-6 sm:py-8 text-center text-xs text-gray-500">
        <p>Escribe al menos 2 letras para buscar en el artículo...</p>
        <div class="mt-3 flex justify-center gap-1.5 sm:gap-2 flex-wrap text-xs">
          <span class="pill-badge cursor-pointer hover:bg-gray-200" (click)="ui.quickSearch('iTransformer')">iTransformer</span>
          <span class="pill-badge cursor-pointer hover:bg-gray-200" (click)="ui.quickSearch('TSMixer')">TSMixer</span>
          <span class="pill-badge cursor-pointer hover:bg-gray-200" (click)="ui.quickSearch('VAR')">VAR</span>
          <span class="pill-badge cursor-pointer hover:bg-gray-200" (click)="ui.quickSearch('Taylor')">Diagrama de Taylor</span>
          <span class="pill-badge cursor-pointer hover:bg-gray-200" (click)="ui.quickSearch('nRMSE')">nRMSE</span>
          <span class="pill-badge cursor-pointer hover:bg-gray-200" (click)="ui.quickSearch('CRISP-DM')">CRISP-DM</span>
        </div>
      </div>

      <div *ngIf="ui.searchQuery && ui.searchQuery.length >= 2 && ui.searchResults.length === 0" class="py-6 sm:py-8 text-center text-xs text-gray-500">
        No se encontraron coincidencias para: <span class="font-bold text-gray-900" [textContent]="ui.searchQuery"></span>
      </div>

      <div *ngIf="ui.searchResults.length > 0" class="space-y-2">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-gray-500 px-1">
          {{ ui.searchResults.length }} coincidencia(s)
        </div>
        <div *ngFor="let m of ui.searchResults" 
          (click)="ui.jumpToSection(m.sectionId)"
          class="p-3 rounded-xl bg-gray-50 hover:bg-gray-100 border border-gray-200/80 cursor-pointer transition-all">
          <div class="flex items-center justify-between text-xs text-gray-900 font-bold mb-1">
            <span>{{ m.sectionTitle }}</span>
            <span class="text-crimson-accent text-[11px] font-bold">Saltar &rarr;</span>
          </div>
          <div class="text-xs text-gray-600 leading-relaxed font-sans">{{ m.snippet }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
