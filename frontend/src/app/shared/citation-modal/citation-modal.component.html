<!-- ============================================================
     MODAL 2: CITATION MODAL (BibTeX / IEEE)
     ============================================================ -->
<div *ngIf="ui.isCitationOpen" (click)="ui.closeCitation()" class="modal-backdrop">
  <div (click)="$event.stopPropagation()" class="subtle-card w-full max-w-lg p-4 sm:p-6 bg-white border border-gray-200 shadow-2xl relative">
    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
      <div class="flex items-center gap-2 text-obsidian-950">
        <svg class="w-5 h-5 text-crimson-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <span class="font-headline font-bold text-sm uppercase tracking-wider">Citar Artículo</span>
      </div>
      <button (click)="ui.closeCitation()" class="p-1 rounded-lg hover:bg-gray-100 text-gray-500 hover:text-gray-900">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="mt-4 space-y-4">
      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold uppercase text-gray-500">Formato BibTeX</span>
          <button (click)="ui.copyBibtex()" class="text-xs text-crimson-accent hover:underline flex items-center gap-1 font-semibold">
            {{ ui.bibtexFeedback }}
          </button>
        </div>
        <pre class="p-3 rounded-xl bg-gray-50 border border-gray-200 text-[11px] font-mono text-gray-800 overflow-x-auto whitespace-pre">{{ ui.bibtexTemplate }}</pre>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold uppercase text-gray-500">Formato IEEE</span>
          <button (click)="ui.copyIeee()" class="text-xs text-crimson-accent hover:underline flex items-center gap-1 font-semibold">
            {{ ui.ieeeFeedback }}
          </button>
        </div>
        <p class="p-3 rounded-xl bg-gray-50 border border-gray-200 text-xs text-gray-700 font-sans leading-relaxed">
          M. A. Mira Ortega, S. Arbelaez Contreras, and J. M. Isaza Vergara, "Estudio comparativo de VAR, LSTM, TSMixer e iTransformer para el pronóstico de series de tiempo meteorológicas multivariadas," <em>Seminario de Grado</em>, 2026.
        </p>
      </div>
    </div>
  </div>
</div>
